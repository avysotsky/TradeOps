name: build

on:
  push:
    branches:
      - main
      - 'TradeOps/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TradeOps.sln

      - name: Build
        run: dotnet build TradeOps.sln --configuration Release --no-restore
