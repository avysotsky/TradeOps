name: build

on:
  push:
    branches:
      - main
      - 'TradeOps/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradeops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tradeops_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore TradeOps.sln

      - name: Build
        run: dotnet build TradeOps.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test TradeOps.sln --configuration Release --no-build --verbosity normal

      - name: API + PostgreSQL smoke test
        env:
          ConnectionStrings__TradeOpsDb: Host=127.0.0.1;Port=5432;Database=tradeops_ci;Username=postgres;Password=postgres
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Exchange__Provider: Mock
          Telegram__Enabled: 'false'
          Worker__ReconciliationIntervalSeconds: '300'
        run: |
          set -euo pipefail

          WORKER_PID=''
          dotnet run \
            --project src/TradeOps.Api \
            --configuration Release \
            --no-build \
            > api.log 2>&1 &
          API_PID=$!

          cleanup() {
            if [ -n "$WORKER_PID" ]; then
              kill "$WORKER_PID" 2>/dev/null || true
            fi
            kill "$API_PID" 2>/dev/null || true
            echo '--- API log ---'
            cat api.log || true
            if [ -f worker.log ]; then
              echo '--- Worker log ---'
              cat worker.log || true
            fi
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5080/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'API did not become live.' >&2
              exit 1
            fi
            sleep 2
          done

          READY=$(curl --fail --silent --show-error http://127.0.0.1:5080/health/ready)
          READY_JSON="$READY" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['READY_JSON'])
          assert data['status'] == 'ready', data
          assert data['dependencies']['postgres'] == 'ready', data
          assert data['dependencies']['exchangeClient'], data
          PY

          OPENAPI=$(curl --fail --silent --show-error http://127.0.0.1:5080/swagger/v1/swagger.json)
          OPENAPI_JSON="$OPENAPI" python3 - <<'PY'
          import json, os
          paths = json.loads(os.environ['OPENAPI_JSON'])['paths']
          for path in (
              '/health/live',
              '/health/ready',
              '/api/signals',
              '/api/signals/{id}',
              '/api/orders/local/{idOrClientOrderId}',
              '/api/orders/local/{idOrClientOrderId}/history',
              '/api/orders/local/{idOrClientOrderId}/cancel',
              '/api/orders/local/cancel-all',
              '/api/system/reconciliation/status',
              '/api/system/recovery/status',
              '/api/fills',
              '/api/pnl/daily',
          ):
              assert path in paths, (path, list(paths))
          PY

          SIGNAL_ID='d0f8625f-2ad4-44eb-a1ec-22acbfbb2e58'
          FIRST=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"quantity\":0.001,\"source\":\"ci\",\"signalId\":\"$SIGNAL_ID\"}" \
            http://127.0.0.1:5080/api/signals)
          FIRST_JSON="$FIRST" python3 - <<'PY'
          import json, os
          order = json.loads(os.environ['FIRST_JSON'])['order']
          assert order['status'] == 'PartiallyFilled', order
          assert abs(float(order['filledQuantity']) - 0.0006) < 1e-12, order
          PY

          SIGNAL_AUDIT=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/signals/$SIGNAL_ID")
          CLIENT_ORDER_ID=$(SIGNAL_AUDIT_JSON="$SIGNAL_AUDIT" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['SIGNAL_AUDIT_JSON'])
          assert data['outcome'] == 'Accepted', data
          assert data['orderId'], data
          print(data['clientOrderId'])
          PY
          )

          HISTORY_INITIAL=$(curl --fail --silent --show-error \
            "http://127.0.0.1:5080/api/orders/local/$CLIENT_ORDER_ID/history")
          HISTORY_INITIAL_JSON="$HISTORY_INITIAL" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['HISTORY_INITIAL_JSON'])
          statuses = [item['status'] for item in data]
          assert statuses[0] == 'Created', data
          assert 'Submitted' in statuses, data
          assert statuses[-1] == 'PartiallyFilled', data
          assert all(item['source'] != 'LegacySnapshot' for item in data), data
          PY

          FILLS=$(curl --fail --silent --show-error 'http://127.0.0.1:5080/api/fills?symbol=BTCUSDT&limit=10')
          FILLS_JSON="$FILLS" python3 - <<'PY'
          import json, os
          assert isinstance(json.loads(os.environ['FILLS_JSON']), list)
          PY

          DAILY_PNL=$(curl --fail --silent --show-error http://127.0.0.1:5080/api/pnl/daily)
          DAILY_PNL_JSON="$DAILY_PNL" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['DAILY_PNL_JSON'])
          assert data['settlementCurrency'] == 'USDT', data
          assert data['isComplete'] is True, data
          PY

          RECONCILIATION=$(curl --fail --silent --show-error -X POST http://127.0.0.1:5080/api/system/reconcile)
          RECONCILIATION_JSON="$RECONCILIATION" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RECONCILIATION_JSON'])
          assert data['updated'] == 1, data
          assert len(data['issues']) == 0, data
          PY

          RECON_STATUS=$(curl --fail --silent --show-error http://127.0.0.1:5080/api/system/reconciliation/status)
          RECON_STATUS_JSON="$RECON_STATUS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RECON_STATUS_JSON'])
          assert data['runType'] == 'OrderReconciliation', data
          assert data['isRunning'] is False, data
          assert data['succeeded'] is True, data
          assert data['ordersScanned'] == 1, data
          assert data['ordersUpdated'] == 1, data
          assert data['orderIssues'] == 0, data
          assert data['ordersMissingOnExchange'] == 0, data
          assert data['completedAt'], data
          PY

          HISTORY_FILLED=$(curl --fail --silent --show-error \
            "http://127.0.0.1:5080/api/orders/local/$CLIENT_ORDER_ID/history")
          HISTORY_FILLED_JSON="$HISTORY_FILLED" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['HISTORY_FILLED_JSON'])
          assert data[-1]['status'] == 'Filled', data
          assert float(data[-1]['filledQuantity']) == 0.001, data
          PY

          RETRY=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"quantity\":0.001,\"source\":\"ci-retry\",\"signalId\":\"$SIGNAL_ID\"}" \
            http://127.0.0.1:5080/api/signals)
          RETRY_JSON="$RETRY" python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['RETRY_JSON'])['order']['status'] == 'Filled'
          PY

          CANCEL_SIGNAL_ID='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Sell\",\"quantity\":0.002,\"source\":\"ci-cancel\",\"signalId\":\"$CANCEL_SIGNAL_ID\"}" \
            http://127.0.0.1:5080/api/signals >/dev/null
          CANCEL_AUDIT=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/signals/$CANCEL_SIGNAL_ID")
          CANCEL_CLIENT_ORDER_ID=$(CANCEL_AUDIT_JSON="$CANCEL_AUDIT" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['CANCEL_AUDIT_JSON'])['clientOrderId'])
          PY
          )
          CANCEL_FIRST=$(curl --fail --silent --show-error -X POST \
            "http://127.0.0.1:5080/api/orders/local/$CANCEL_CLIENT_ORDER_ID/cancel")
          CANCEL_FIRST_JSON="$CANCEL_FIRST" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['CANCEL_FIRST_JSON'])
          assert data['outcome'] == 'Cancelled', data
          assert data['order']['status'] == 'Cancelled', data
          PY
          CANCEL_RETRY=$(curl --fail --silent --show-error -X POST \
            "http://127.0.0.1:5080/api/orders/local/$CANCEL_CLIENT_ORDER_ID/cancel")
          CANCEL_RETRY_JSON="$CANCEL_RETRY" python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['CANCEL_RETRY_JSON'])['outcome'] == 'AlreadyCancelled'
          PY
          CANCEL_HISTORY=$(curl --fail --silent --show-error \
            "http://127.0.0.1:5080/api/orders/local/$CANCEL_CLIENT_ORDER_ID/history")
          CANCEL_HISTORY_JSON="$CANCEL_HISTORY" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['CANCEL_HISTORY_JSON'])
          assert data[-1]['status'] == 'Cancelled', data
          assert 'PartiallyFilled' in [item['status'] for item in data], data
          PY

          BULK_BTC_SIGNAL='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
          BULK_ETH_SIGNAL='cccccccc-cccc-4ccc-8ccc-cccccccccccc'
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"quantity\":0.003,\"source\":\"ci-bulk-btc\",\"signalId\":\"$BULK_BTC_SIGNAL\"}" \
            http://127.0.0.1:5080/api/signals >/dev/null
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"ETHUSDT\",\"side\":\"Sell\",\"quantity\":0.004,\"source\":\"ci-bulk-eth\",\"signalId\":\"$BULK_ETH_SIGNAL\"}" \
            http://127.0.0.1:5080/api/signals >/dev/null

          BULK_BTC_AUDIT=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/signals/$BULK_BTC_SIGNAL")
          BULK_ETH_AUDIT=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/signals/$BULK_ETH_SIGNAL")
          BULK_BTC_CLIENT=$(BULK_AUDIT="$BULK_BTC_AUDIT" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['BULK_AUDIT'])['clientOrderId'])
          PY
          )
          BULK_ETH_CLIENT=$(BULK_AUDIT="$BULK_ETH_AUDIT" python3 - <<'PY'
          import json, os
          print(json.loads(os.environ['BULK_AUDIT'])['clientOrderId'])
          PY
          )

          BULK_RESULT=$(curl --fail --silent --show-error -X POST \
            'http://127.0.0.1:5080/api/orders/local/cancel-all?symbol=BTCUSDT')
          BULK_RESULT_JSON="$BULK_RESULT" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['BULK_RESULT_JSON'])
          assert data['symbol'] == 'BTCUSDT', data
          assert data['candidateCount'] == 1, data
          assert data['cancelledCount'] == 1, data
          assert data['isComplete'] is True, data
          PY
          BULK_BTC_LOCAL=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/orders/local/$BULK_BTC_CLIENT")
          BULK_ETH_LOCAL=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/orders/local/$BULK_ETH_CLIENT")
          BULK_BTC_LOCAL_JSON="$BULK_BTC_LOCAL" BULK_ETH_LOCAL_JSON="$BULK_ETH_LOCAL" python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['BULK_BTC_LOCAL_JSON'])['status'] == 'Cancelled'
          assert json.loads(os.environ['BULK_ETH_LOCAL_JSON'])['status'] == 'PartiallyFilled'
          PY
          BULK_RETRY=$(curl --fail --silent --show-error -X POST \
            'http://127.0.0.1:5080/api/orders/local/cancel-all?symbol=BTCUSDT')
          BULK_RETRY_JSON="$BULK_RETRY" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['BULK_RETRY_JSON'])
          assert data['candidateCount'] == 0, data
          assert data['isComplete'] is True, data
          PY

          STOP=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"enabled":true,"reason":"CI persistent emergency-stop verification"}' \
            http://127.0.0.1:5080/api/risk/emergency-stop)
          STOP_JSON="$STOP" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['STOP_JSON'])
          assert data['emergencyStop'] is True, data
          assert data['orderCancellation']['candidateCount'] == 1, data
          assert data['orderCancellation']['cancelledCount'] == 1, data
          assert data['orderCancellation']['isComplete'] is True, data
          PY
          BULK_ETH_AFTER=$(curl --fail --silent --show-error "http://127.0.0.1:5080/api/orders/local/$BULK_ETH_CLIENT")
          BULK_ETH_AFTER_JSON="$BULK_ETH_AFTER" python3 - <<'PY'
          import json, os
          assert json.loads(os.environ['BULK_ETH_AFTER_JSON'])['status'] == 'Cancelled'
          PY

          BLOCKED_SIGNAL_ID='99999999-9999-4999-8999-999999999999'
          BLOCKED_STATUS=$(curl --silent --show-error -o blocked.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"quantity\":0.001,\"source\":\"ci-risk-block\",\"signalId\":\"$BLOCKED_SIGNAL_ID\"}" \
            http://127.0.0.1:5080/api/signals)
          test "$BLOCKED_STATUS" = '422'

          CLEAR=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"enabled":false}' \
            http://127.0.0.1:5080/api/risk/emergency-stop)
          CLEAR_JSON="$CLEAR" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['CLEAR_JSON'])
          assert data['emergencyStop'] is False, data
          assert data['orderCancellation'] is None, data
          PY

          dotnet run \
            --project src/TradeOps.Worker \
            --configuration Release \
            --no-build \
            > worker.log 2>&1 &
          WORKER_PID=$!

          RECOVERY_STATUS=''
          for attempt in $(seq 1 30); do
            HTTP_STATUS=$(curl --silent --output recovery.json --write-out '%{http_code}' \
              http://127.0.0.1:5080/api/system/recovery/status)
            if [ "$HTTP_STATUS" = '200' ]; then
              RECOVERY_STATUS=$(cat recovery.json)
              if RECOVERY_JSON="$RECOVERY_STATUS" python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ['RECOVERY_JSON'])
          sys.exit(0 if data['isRunning'] is False and data['succeeded'] is True else 1)
          PY
              then
                break
              fi
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Worker recovery status did not complete successfully.' >&2
              exit 1
            fi
            sleep 1
          done

          RECOVERY_JSON="$RECOVERY_STATUS" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['RECOVERY_JSON'])
          assert data['runType'] == 'RecoveryCycle', data
          assert data['isRunning'] is False, data
          assert data['succeeded'] is True, data
          assert data['completedAt'], data
          assert data['positionsCompared'] >= 1, data
          assert data['positionSnapshots'] >= 1, data
          PY

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build api worker
